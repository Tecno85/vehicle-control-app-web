<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-labelledby="titulo descripcion" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="titulo">Modelo de datos de VehicleControlApp Web</title>
  <desc id="descripcion">Seis tablas. usuarios tiene muchos vehiculos y muchas categorias_gasto. vehiculos tiene muchos ingresos, gastos y documentos. categorias_gasto clasifica muchos gastos.</desc>
  <style>
    .caja { fill: #eef4f1; stroke: #1f6b70; stroke-width: 1.5; }
    .nombre { font-size: 22px; font-weight: 700; fill: #19332f; }
    .campo { font-size: 18px; fill: #19332f; }
    .clave { font-weight: 700; fill: #1f6b70; }
    .linea { fill: none; stroke: #1f6b70; stroke-width: 2.5; }
    .card { font-size: 17px; fill: #19332f; }
    .leyenda { font-size: 16px; fill: #3d524c; }
  </style>
  <rect width="1240" height="760" fill="#ffffff"/>

  <!-- Relaciones -->
  <line class="linea" x1="320" y1="140" x2="440" y2="140"/>
  <text class="card" x="330" y="130">1</text><text class="card" x="394" y="130">0..N</text>

  <line class="linea" x1="780" y1="140" x2="900" y2="140"/>
  <text class="card" x="790" y="130">1</text><text class="card" x="854" y="130">0..N</text>

  <line class="linea" x1="170" y1="320" x2="170" y2="400"/>
  <text class="card" x="180" y="342">1</text><text class="card" x="180" y="392">0..N</text>

  <line class="linea" x1="560" y1="320" x2="560" y2="400"/>
  <text class="card" x="570" y="342">1</text><text class="card" x="570" y="392">0..N</text>

  <polyline class="linea" points="720,320 720,360 1060,360 1060,400"/>
  <text class="card" x="730" y="345">1</text><text class="card" x="1070" y="392">0..N</text>

  <line class="linea" x1="320" y1="480" x2="440" y2="480"/>
  <text class="card" x="330" y="470">1</text><text class="card" x="394" y="470">0..N</text>

  <!-- usuarios -->
  <rect class="caja" x="20" y="60" width="300" height="260" rx="4"/>
  <text class="nombre" x="44" y="100">usuarios</text>
  <text class="campo" x="44" y="140"><tspan class="clave">PK</tspan> id</text>
  <text class="campo" x="44" y="170">nombre · correo</text>
  <text class="campo" x="44" y="200">contrasena_hash</text>
  <text class="campo" x="44" y="230">activo · creado_en</text>

  <!-- vehiculos -->
  <rect class="caja" x="440" y="60" width="340" height="260" rx="4"/>
  <text class="nombre" x="464" y="100">vehiculos</text>
  <text class="campo" x="464" y="140"><tspan class="clave">PK</tspan> id</text>
  <text class="campo" x="464" y="170"><tspan class="clave">FK</tspan> usuario_id</text>
  <text class="campo" x="464" y="200">placa · marca · modelo</text>
  <text class="campo" x="464" y="230">tipo · habilitado_indrive</text>
  <text class="campo" x="464" y="260">conductor · cuota_diaria</text>
  <text class="campo" x="464" y="290">activo · creado_en</text>

  <!-- documentos -->
  <rect class="caja" x="900" y="60" width="320" height="260" rx="4"/>
  <text class="nombre" x="924" y="100">documentos</text>
  <text class="campo" x="924" y="140"><tspan class="clave">PK</tspan> id</text>
  <text class="campo" x="924" y="170"><tspan class="clave">FK</tspan> vehiculo_id</text>
  <text class="campo" x="924" y="200">tipo · nombre · vencimiento</text>
  <text class="campo" x="924" y="230">creado_en</text>

  <!-- categorias_gasto -->
  <rect class="caja" x="20" y="400" width="300" height="260" rx="4"/>
  <text class="nombre" x="44" y="440">categorias_gasto</text>
  <text class="campo" x="44" y="480"><tspan class="clave">PK</tspan> id</text>
  <text class="campo" x="44" y="510"><tspan class="clave">FK</tspan> usuario_id</text>
  <text class="campo" x="44" y="540">nombre · activo</text>

  <!-- gastos -->
  <rect class="caja" x="440" y="400" width="340" height="260" rx="4"/>
  <text class="nombre" x="464" y="440">gastos</text>
  <text class="campo" x="464" y="480"><tspan class="clave">PK</tspan> id</text>
  <text class="campo" x="464" y="510"><tspan class="clave">FK</tspan> vehiculo_id</text>
  <text class="campo" x="464" y="540"><tspan class="clave">FK</tspan> categoria_id</text>
  <text class="campo" x="464" y="570">fecha · valor · descripcion</text>
  <text class="campo" x="464" y="600">creado_en</text>

  <!-- ingresos -->
  <rect class="caja" x="900" y="400" width="320" height="260" rx="4"/>
  <text class="nombre" x="924" y="440">ingresos</text>
  <text class="campo" x="924" y="480"><tspan class="clave">PK</tspan> id</text>
  <text class="campo" x="924" y="510"><tspan class="clave">FK</tspan> vehiculo_id</text>
  <text class="campo" x="924" y="540">tipo · fecha · valor</text>
  <text class="campo" x="924" y="570">cuota_referencia</text>
  <text class="campo" x="924" y="600">motivo · nota · creado_en</text>

  <!-- Leyenda -->
  <text class="leyenda" x="20" y="712">PK = identifica la fila · FK = enlaza otra tabla · 1 = uno · 0..N = cero o muchos</text>
  <text class="leyenda" x="20" y="740">Diseño inicial para revisión · No representa una base de datos implementada</text>
</svg>
